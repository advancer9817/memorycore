server:
  port: ${SERVER_PORT:8318}
  # 修复：此前未设 address，Spring Boot 默认监听 0.0.0.0 —— 配合"default 租户免鉴权"
  # 等于把默认库匿名读写暴露到网络。Python 侧有 validate_frontend_bind 拒绝非回环绑定，
  # Java 缺失该护栏。此处默认仅回环；如需对外（如 Cloudflare Tunnel 已在本机回源）无需放开。
  address: ${MCORE_BIND:127.0.0.1}

spring:
  application:
    name: mcore-server
  datasource:
    host: ${MCORE_DB_HOST:127.0.0.1}
    port: ${MCORE_DB_PORT:5432}
    username: ${MCORE_DB_USER:mcore_user}
    password: ${MCORE_DB_PASSWORD:mcore_secure_password_2026}
    default-db: ${MCORE_DEFAULT_DB:mcore}
    system-db: ${MCORE_SYSTEM_DB:mcore_system}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # 备份导入通道：默认 1MB 上限会让任何真实备份（当前约 1.7MB）导入失败并返回 413，
      # 此处按记忆库规模放宽，可用环境变量覆盖。
      max-file-size: ${MCORE_MAX_UPLOAD:200MB}
      max-request-size: ${MCORE_MAX_UPLOAD:200MB}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.mcore.common.model
  # type-handlers-package: org.mcore.storage.mybatis.handler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    root: INFO
    org.mcore: INFO
    org.mybatis: INFO

# 多租户安全策略
mcore:
  security:
    # 是否启用租户鉴权（关闭后任意 X-Tenant-Id 均可访问，仅供本地调试）
    enabled: ${MCORE_SECURITY_ENABLED:true}
    # 共享默认租户，免密钥访问以兼容本地 Agent 钩子
    default-tenant: ${MCORE_DEFAULT_TENANT:default}
  extraction:
    base-url: ${MCORE_EXTRACTION_BASE_URL:http://127.0.0.1:8317/v1}
    api-key: ${MCORE_EXTRACTION_API_KEY:sk}
    model: ${MCORE_EXTRACTION_MODEL:gemini-3.8-flash}
    timeout: ${MCORE_EXTRACTION_TIMEOUT:90}
  embedding:
    ollama-url: ${MCORE_EMBEDDING_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${MCORE_EMBEDDING_MODEL:bge-m3}
    api-url: ${MCORE_EMBEDDING_API_URL:}
    api-key: ${MCORE_EMBEDDING_API_KEY:sk}
    dim: ${MCORE_EMBEDDING_DIM:1024}
