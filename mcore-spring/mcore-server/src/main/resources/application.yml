server:
  port: ${SERVER_PORT:8318}

spring:
  application:
    name: mcore-server
  datasource:
    host: ${MCORE_DB_HOST:127.0.0.1}
    port: ${MCORE_DB_PORT:5432}
    username: ${MCORE_DB_USER:mcore_user}
    password: ${MCORE_DB_PASSWORD:mcore_secure_password_2026}
    default-db: ${MCORE_DEFAULT_DB:mcore}
    system-db: ${MCORE_SYSTEM_DB:mcore_system}
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.mcore.common.model
  type-handlers-package: org.mcore.storage.mybatis.handler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    root: INFO
    org.mcore: INFO
    org.mybatis: INFO
