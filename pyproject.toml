[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-memory-mcp"
version = "0.20.0"
description = "Structured agent memory with SQLite/FTS5 + optional Qdrant vector search, exposed via MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0,<2.0",
]

[project.optional-dependencies]
vector = ["qdrant-client>=1.18.0,<2.0"]
extraction = ["httpx>=0.27.0"]
all = ["local-memory-mcp[vector,extraction]"]
dev = [
    "pytest>=9.0.0",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
local-memory-mcp = "local_memory_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["local_memory_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
