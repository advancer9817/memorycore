[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memorycore"
version = "0.25.0"
description = "Structured agent memory with SQLite/FTS5 + optional Qdrant vector search, exposed via MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0,<2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.18.0,<2.0",
]

[project.optional-dependencies]
vector = []
extraction = []
embedding = []
all = []
full = []
dev = [
    "pytest>=9.0.0",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
memorycore = "memorycore.server:main"
mcore = "memorycore.server:main"

[tool.hatch.build.targets.wheel]
packages = ["memorycore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
