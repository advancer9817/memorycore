backend:
  fallback: sqlite
  primary: sqlite
database:
  host: 127.0.0.1
  port: 5432
  name: mcore
  user: mcore_user
  password: mcore_secure_password_2026
  min_pool_size: 2
  max_pool_size: 10
  timeout: 30.0
  sslmode: prefer
context_pack:
  default_token_budget: 2000
  max_total_records: 12
  max_records_per_group: 3
  include_stale_warnings: true
  profile_boost_weight: 0.15
  profile_conflict_filter_enabled: true
  profile_conflict_penalty: 0.6
  profile_query_expand_enabled: true
  profile_query_expand_max_terms: 3
  profile_query_expand_min_overlap: 1
  hard_constraints:
    enabled: true
    rules:
      - "代码提交/推送前必须在仓库根目录追加 ITERATION.md 迭代记录"
embedding:
  api_key: ''
  api_url: ''
  dim: 768
  fallback_provider: hashing
  model: nomic-embed-text
  ollama_url: http://127.0.0.1:11434
  provider: auto
  sentence_transformers_model: sentence-transformers/all-mpnet-base-v2
  timeout: 30
extraction:
  api_key: nk
  base_url: http://127.0.0.1:8317
  max_tokens: 10000
  model: gemini-3.8-flash
  temperature: 1
  timeout: 600
extraction_strategy:
  chinese_detection_ratio: 0.15
  context_memory_limit: 10
  context_sample_length: 200
  dedup_search_limit: 5
  default_confidence: 0.65
  default_decay_policy: review
  default_importance: 0.5
  default_memory_type: episodic_memory
  default_scope: global
  default_status: active
  link_threshold: 0.55
  max_related_ids: 10
  min_importance: 0.5
  skip_threshold: 0.88
  title_max_length: 80
  update_threshold: 0.82
governance:
  auto_approve_confidence: 0.8
  auto_approve_low_risk_confidence: 0.7
  high_importance_threshold: 0.85
  manual_only_actions:
  - split
  merge_actions:
  - archive_and_merge_duplicate
  precious_types:
  - user_profile
  - decision
  - project_memory
  review_confidence_threshold: 0.55
llm_curator:
  batch_size: 10
  content_max_chars: 5000
  importance_limit: 2000
  keep_threshold: 0.01
  max_contradiction_pairs: 60
  max_dedup_pairs: 60
  max_link_pairs: 40
  max_split_candidates: 100
  preset: deep
  prompt_style: aggressive
  review_cooldown_seconds: 3600
  reviewed_ids_max_age_seconds: 43200
  sim_threshold: 0.8
  split_content_threshold: 200
  split_enabled: false
  temperature: 0.8
output_language: zh
qdrant:
  collection: agent_memory
  timeout: 30
  url: http://127.0.0.1:6333
rule_curator:
  archive_days_default: 365
  archive_days_episodic: 30
  candidate_ttl_default_days: 7
  candidate_ttl_episodic_days: 7
  candidate_ttl_precious_days: 30
  contradicted_archive_days: 90
  decay_interval_days: 30
  decay_min_confidence: 0.15
  decay_step: 0.05
  never_accessed_candidate_days: 14
  precious_stale_feedback: -2
  precious_stale_importance: 0.3
  precious_types:
  - user_profile
  - environment_fact
  - decision
  - project_memory
  - skill_candidate
  promote_importance_threshold: 0.75
  promote_injected_threshold: 3
  revival_effectiveness_min: 0.5
  revival_feedback_min: 0
  revival_window_days: 7
  skill_promote_feedback_min: 0
  skill_promote_importance: 0.65
  stale_days_default: 180
  stale_days_episodic: 14
  stale_feedback_threshold: -0.5
  stale_importance_threshold: 0.45
subject_context:
  auto_discover: true
  default_scope: global
  discovery_roots:
    - ~/project
    - ~/公共的
  enabled: true
  projects:
  - aliases:
    - memorycore
    - MemoryCore
    name: mcore
    paths:
    - ~/project/memorycore
    scope: project
temporal:
  auto_supersede_user_corrections: true
  contradiction_detection: heuristic
  dedup_temporal_guard: true
  enabled: true
  governance_age_risk_days: 7
  llm_temporal_prompts: true
  recency_half_life_days: 90
user_profile:
  enabled: true
  extract_limit: 200
  max_snapshot_chars: 800
  min_confidence: 0.6
  task_slices:
    enabled: true
    tech_attributes:
      - 技术栈
      - 常用工具
      - 当前项目
      - 模型偏好
      - 沟通偏好
    doc_attributes:
      - 输出偏好
      - 沟通偏好
      - 语言
      - 工作领域
  schema:
  - description: 用户的姓名
    name: 姓名
  - description: 用户的职业/岗位
    name: 职业
  - description: 用户所在公司或雇主名称
    name: 雇主
  - description: 用户日常工作涉及的领域、平台、系统
    name: 工作领域
  - description: 用户的技术背景、技能与开发环境
    immutable: true
    name: 技术栈
  - description: 用户偏好的回答语言、风格、格式、交互方式
    name: 沟通偏好
  - description: 用户偏好的模型/供应商/路由
    name: 模型偏好
  - description: 用户当前的学习重点与转型目标
    name: 学习方向
  - description: 用户主要使用的语言（沟通、文档、代码注释）
    name: 语言
  - description: 用户常用的开发/办公/流程工具链
    name: 常用工具
  - description: 用户正在推进的项目/产品/任务焦点
    name: 当前项目
  - description: 用户关注的技术方向、行业趋势与话题
    name: 兴趣关注
  - description: 工作时区、作息节奏、会议/响应时间偏好
    name: 时间偏好
  - description: 用户偏好的产出物格式（报告/图表/代码/演示等）
    name: 输出偏好
