services:
  lmmcp:
    build:
      context: .
      args:
        INSTALL_VECTOR: "false"   # set to "true" to include qdrant-client
    ports:
      - "8318:8318"
    volumes:
      - lmmcp_data:/data
    environment:
      LOCAL_MEMORY_DB: /data/memory.sqlite3
      # LOCAL_MEMORY_CONFIG: /data/config.yaml
    restart: unless-stopped

  # Optional: uncomment to run a local Qdrant instance for vector search
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   restart: unless-stopped

volumes:
  lmmcp_data:
  # qdrant_data:
